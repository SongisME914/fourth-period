<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10111c"><title>第四節下課｜手機橫向試玩 V0.5</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d101b;color:#f8ebd0;font-family:system-ui,'Noto Sans TC',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}[hidden]{display:none!important}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}#app{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#25243a,#0b0d15)}#stage{position:relative;width:min(100vw,177.777vh);height:min(100vh,56.25vw);overflow:hidden;background:#151725}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#menu,#select,#result{z-index:6;position:absolute;inset:0;background:linear-gradient(130deg,#10111bef,#25233be8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}h1{font-size:clamp(28px,5vw,64px);margin:0;color:#ffcb77;text-shadow:4px 4px #7c3a4a;letter-spacing:.1em}h2{margin:0;color:#ffcb77;font-size:clamp(20px,3vw,38px)}p{margin:2px;font-size:clamp(10px,1.45vw,17px)}.row{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.choice{border:2px solid #ffca7b;background:#2c2b41;padding:12px 20px;min-width:170px;border-radius:5px;font-weight:900}.choice:active,.choice:hover{background:#654453}.card{border:2px solid #666783;background:#282a3b;padding:10px 14px;min-width:125px;border-radius:5px}.card strong{display:block;color:#ffd38c}.card small{display:block;font-size:11px;margin-top:5px}.card.active{border-color:#ffd38c;background:#57435b}#hud{z-index:3;position:absolute;inset:0;pointer-events:none;display:none}#top{position:absolute;top:3%;left:3%;right:3%;display:flex;justify-content:space-between;align-items:start;gap:20px;font-weight:bold;font-size:clamp(10px,1.4vw,19px)}.hp{height:12px;border:2px solid #e2c69b;background:#271e29;width:27vw;max-width:310px}.fill{height:100%;background:#e6b95b;width:100%}#enemyFill{background:#d26b74}#notice{position:absolute;top:19%;left:0;right:0;text-align:center;font-weight:900;color:#ffdf98;text-shadow:2px 2px #000;font-size:clamp(12px,2vw,24px)}#controls{z-index:5;position:absolute;bottom:26%;left:2%;right:2%;display:none;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:8px;align-items:end;pointer-events:auto;position:relative;z-index:10}.ctl{border:2px solid #f5d59c99;background:#30364cbb;border-radius:50%;width:clamp(46px,6.5vw,76px);height:clamp(46px,6.5vw,76px);font-weight:900;font-size:clamp(11px,1.6vw,18px);-webkit-tap-highlight-color:transparent}.ctl:active,.ctl.pressed{background:#b57b65cc;transform:scale(.95)}#back{position:absolute;top:13%;right:3%;background:#22283dcc;border:1px solid #ccc;padding:5px 10px;pointer-events:auto}#rotate{pointer-events:none;position:absolute;inset:0;background:#0e1020;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;z-index:9;text-align:center;padding:30px}#rotate b{font-size:23px;color:#ffcc79}@media(orientation:portrait) and (max-width:900px){#rotate{display:flex}}@media(max-height:430px){.choice{padding:8px 14px}.card{padding:7px 10px}#menu,#select,#result{gap:7px}}
</style></head><body><div id="app"><div id="stage"><canvas id="game" width="960" height="540"></canvas><div id="hud"><div id="top"><div><span id="playerName"></span><div class="hp"><div id="playerFill" class="fill"></div></div></div><div style="text-align:right"><span id="enemyName"></span><div class="hp"><div id="enemyFill" class="fill"></div></div></div></div><div id="notice"></div><div id="debug" style="position:absolute;top:27%;left:3%;font-size:11px;color:#b9edff;background:#15182799;padding:3px 7px">控制器就緒 · V0.5</div><button id="back">返回選單</button></div><div id="controls"><div class="cluster"><button class="ctl" data-key="left">◀</button><button class="ctl" data-key="right">▶</button><button class="ctl" data-key="jump">跳</button></div><div class="cluster"><button class="ctl" data-key="guard">防</button><button class="ctl" data-key="light">拳</button><button class="ctl" data-key="heavy">重</button><button class="ctl" data-key="skill">必</button></div></div><div id="menu"><h1>第四節下課</h1><p>AFTER FOURTH PERIOD · MOBILE DEMO V0.5</p><div class="row"><button class="choice" data-mode="arcade">ARCADE<br><small>單人 VS 電腦</small></button><button class="choice" data-mode="boss">BOSS RAID<br><small>四人 VS 最終班導</small></button></div><p>手機請橫向遊玩｜控制鍵已上移，避開網站底部廣告</p></div><div id="select" hidden><h2>選擇你的角色</h2><div class="row" id="cards"></div><button id="start" class="choice">開始戰鬥 ▶</button><button id="cancel">返回</button></div><div id="result" hidden><h2 id="resultText"></h2><p id="resultSub"></p><button id="again" class="choice">再玩一次</button><button id="home" class="choice">回主選單</button></div></div><div id="rotate"><b>↻ 請將手機橫向旋轉</b><span>《第四節下課》採用橫向格鬥畫面</span></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const chars=[{name:'淵褐賢者',color:'#a47a5b',accent:'#c6c1a5',skill:'音波'},{name:'蒼藍猿王',color:'#68a8d8',accent:'#b2d6e8',skill:'猿躍'},{name:'鎏金暴徒',color:'#e1b44b',accent:'#f4e19c',skill:'黃金衝刺'},{name:'鍛黑狂犬',color:'#535965',accent:'#e89b69',skill:'引擎衝拳'}];let mode='arcade',picked=0,screen='menu',fighters=[],player,boss,phase=1,last=0,elapsed=0,flash=0,noticeTimer=0;const input={left:false,right:false,jump:false,guard:false,light:false,heavy:false,skill:false};const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function view(s){screen=s;for(const id of ['menu','select','result'])$(id).hidden=id!==s;$('hud').style.display=s==='play'?'block':'none';$('controls').style.display=s==='play'?'flex':'none';}function make(c,x,team,ai=false,isBoss=false){return {c,x,y:430,vx:0,vy:0,team,ai,isBoss,hp:isBoss?(phase===1?360:550):100,max:isBoss?(phase===1?360:550):100,face:team===0?1:-1,cd:0,skillCd:0,stun:0,attack:0,guard:false,w:isBoss?(phase===1?58:110):34,h:isBoss?(phase===1?90:145):75};}function begin(){for(const k in input)input[k]=false;phase=1;elapsed=0;flash=0;noticeTimer=2;fighters=[];player=make(chars[picked],mode==='boss'?210:250,0);fighters.push(player);if(mode==='boss'){[0,1,2,3].forEach(i=>{if(i!==picked)fighters.push(make(chars[i],130+i*65,0,true))});boss=make({name:'最終班導',color:'#b79a89',accent:'#d8c2b7'},730,1,true,true);fighters.push(boss);say('第一階段：班級管理模式',2.5)}else{boss=make(chars[(picked+1)%4],700,1,true);fighters.push(boss);say('ROUND 1 · FIGHT!',2)}view('play');}function say(t,sec=1){$('notice').textContent=t;noticeTimer=sec}function hit(a,b,damage,range){if(a.team===b.team||b.hp<=0)return;const dist=Math.abs(a.x-b.x);if(dist>range||Math.abs((a.y-a.h/2)-(b.y-b.h/2))>115)return;if(Math.sign(b.x-a.x)!==a.face&&dist>28)return;let d=damage;if(b.guard)d*=.22;b.hp=Math.max(0,b.hp-d);b.stun=.13;b.vx+=(b.x>a.x?1:-1)*(b.guard?75:170);flash=.08;}function attack(a,type){if(a.cd>0||a.stun>0||a.hp<=0)return;if(type==='skill'&&a.skillCd>0)return;const heavy=type==='heavy',skill=type==='skill';a.cd=skill?.85:heavy?.55:.3;a.attack=skill?.5:.2;if(skill)a.skillCd=3.5;const dmg=skill?25:heavy?15:8;const range=skill?165:heavy?90:73;for(const b of fighters)hit(a,b,dmg,range);if(a===player&&skill)say(a.c.skill+'！',.65);}function update(dt){if(screen!=='play')return;elapsed+=dt;flash=Math.max(0,flash-dt);noticeTimer=Math.max(0,noticeTimer-dt);if(!noticeTimer)$('notice').textContent='';for(const a of fighters){if(a.hp<=0)continue;a.cd=Math.max(0,a.cd-dt);a.skillCd=Math.max(0,a.skillCd-dt);a.stun=Math.max(0,a.stun-dt);a.attack=Math.max(0,a.attack-dt);let left=false,right=false,jump=false,guard=false;if(a===player){left=input.left;right=input.right;jump=input.jump;guard=input.guard;for(const k of ['light','heavy','skill'])if(input[k]){attack(a,k);input[k]=false;}}else{let target=a.team===1?player:boss;if(a.isBoss&&mode==='boss'&&Math.floor(elapsed/9)%2===1)target=player;const dx=target.x-a.x;left=dx<-(a.isBoss?95:65);right=dx>(a.isBoss?95:65);jump=!a.isBoss&&Math.random()<.005;guard=Math.random()<.015;if(Math.abs(dx)<(a.isBoss?125:90)&&a.cd===0)attack(a,Math.random()<.16?'skill':Math.random()<.35?'heavy':'light');}a.guard=guard;a.face=left?-1:right?1:a.face;if(a.stun===0){a.vx=(right?1:0)-(left?1:0);a.vx*=a.isBoss?125:210;if(guard)a.vx*=.3;if(jump&&a.y>=430)a.vy=-490;}a.vy+=1200*dt;a.x=clamp(a.x+a.vx*dt,32,928);a.y=Math.min(430,a.y+a.vy*dt);if(a.y>=430)a.vy=0;}if(boss.hp<=0){if(mode==='boss'&&phase===1){phase=2;boss=make({name:'靜立反思・最終裁決',color:'#a57977',accent:'#f04748'},745,1,true,true);fighters=fighters.filter(a=>a.team===0);fighters.push(boss);for(const a of fighters)if(a.team===0)a.hp=Math.min(a.max,a.hp+35);say('第二階段：靜立反思！',3)}else finish(true);}if(player.hp<=0)finish(false);$('playerName').textContent=player.c.name;$('enemyName').textContent=boss.c.name;$('playerFill').style.width=(100*player.hp/player.max)+'%';$('enemyFill').style.width=(100*boss.hp/boss.max)+'%';}function finish(win){if(screen!=='play')return;$('resultText').textContent=win?'STAGE CLEAR!':'GAME OVER';$('resultSub').textContent=win?(mode==='boss'?'鐘聲響起！四人終於衝出校門！':'漂亮的一勝！'):'再試一次，第四節還沒下課！';view('result')}function draw(){const w=960,h=540;ctx.fillStyle='#17192b';ctx.fillRect(0,0,w,h);ctx.fillStyle='#24263c';ctx.fillRect(0,0,w,390);ctx.fillStyle='#303147';for(let i=0;i<9;i++){ctx.fillRect(30+i*120,50,75,150);ctx.fillStyle='#4e4b60';ctx.fillRect(36+i*120,56,63,138);ctx.fillStyle='#303147'}ctx.fillStyle='#6b6060';ctx.fillRect(0,390,w,150);ctx.fillStyle='#8c7771';ctx.fillRect(0,430,w,8);ctx.fillStyle='#292637';for(let i=0;i<15;i++)ctx.fillRect(i*70,455,52,4);ctx.fillStyle='#f0cb8b';ctx.font='bold 18px monospace';ctx.fillText(mode==='boss'?'SCHOOL HALL / CLASSROOM':'AFTER SCHOOL · TRAINING',25,35);for(const a of fighters){if(a.hp<=0)continue;ctx.save();ctx.translate(Math.round(a.x),Math.round(a.y));ctx.scale(a.face,1);ctx.fillStyle='#1a1522';ctx.fillRect(-a.w/2+4,-9,a.w,9);ctx.fillStyle=a.c.color;ctx.fillRect(-a.w/2,-a.h+24,a.w,a.h-26);ctx.fillStyle='#272532';ctx.fillRect(-a.w/2,-24,a.w*.43,24);ctx.fillRect(a.w*.07,-24,a.w*.43,24);ctx.fillStyle=a.c.accent;ctx.fillRect(-a.w*.35,-a.h+4,a.w*.7,25);ctx.fillStyle='#191a27';ctx.fillRect(-a.w*.35,-a.h+1,a.w*.7,9);ctx.fillStyle='#f6d6b6';ctx.fillRect(-a.w*.3,-a.h+13,a.w*.6,14);ctx.fillStyle='#151724';ctx.fillRect(a.w*.12,-a.h+17,5,4);ctx.fillStyle=a.guard?'#7fd5e5':a.attack>0?'#ffd17e':a.c.color;ctx.fillRect(a.w*.3,-a.h+40,a.attack>0?45:16,14);if(a.attack>0){ctx.strokeStyle='#ffcf7a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(a.w*.7,-a.h+44,35,-.9,.8);ctx.stroke()}if(a===player){ctx.fillStyle='#ffe08c';ctx.beginPath();ctx.moveTo(0,-a.h-18);ctx.lineTo(-9,-a.h-32);ctx.lineTo(9,-a.h-32);ctx.fill()}ctx.restore();}if(flash>0){ctx.fillStyle='#ffffff20';ctx.fillRect(0,0,w,h)}if(screen==='menu'||screen==='select'||screen==='result'){ctx.fillStyle='#151827';ctx.fillRect(0,0,w,h);for(let i=0;i<50;i++){ctx.fillStyle=i%3?'#25283d':'#3c3343';ctx.fillRect((i*173)%960,(i*79)%540,4,4)}}}function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}const cards=$('cards');chars.forEach((c,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<strong>${c.name}</strong><small>${c.skill}</small>`;b.addEventListener('click',()=>{picked=i;[...cards.children].forEach((x,j)=>x.classList.toggle('active',j===i))});cards.appendChild(b)});cards.children[0].classList.add('active');document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;view('select')}));$('start').addEventListener('click',begin);$('cancel').addEventListener('click',()=>view('menu'));$('back').addEventListener('click',()=>view('menu'));$('again').addEventListener('click',begin);$('home').addEventListener('click',()=>view('menu'));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;let active=false;function down(e){if(e.cancelable)e.preventDefault();active=true;input[k]=true;$('debug').textContent='按鍵偵測：'+k+' ✓';b.classList.add('pressed');if(['light','heavy','skill'].includes(k)){attack(player,k);input[k]=false;} }function up(e){if(e&&e.cancelable)e.preventDefault();active=false;input[k]=false;b.classList.remove('pressed')}if(window.PointerEvent){b.addEventListener('pointerdown',down,{passive:false});window.addEventListener('pointerup',e=>{if(active)up(e)},{passive:false});window.addEventListener('pointercancel',e=>{if(active)up(e)},{passive:false})}else{b.addEventListener('touchstart',down,{passive:false});b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false});b.addEventListener('mousedown',down);window.addEventListener('mouseup',up)}b.addEventListener('click',e=>{if(screen!=='play')return; $('debug').textContent='點擊偵測：'+k+' ✓'; if(['light','heavy','skill'].includes(k))attack(player,k); else if(k==='jump'&&player&&player.y>=430)player.vy=-490; else if((k==='left'||k==='right')&&player)player.x=Math.max(32,Math.min(928,player.x+(k==='left'?-26:26)));});b.addEventListener('contextmenu',e=>e.preventDefault());});const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',a:'left',d:'right',w:'jump',j:'light',k:'heavy',l:'skill',s:'guard'};window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();input[keys[e.key]]=true}});window.addEventListener('keyup',e=>{if(keys[e.key])input[keys[e.key]]=false});window.addEventListener('blur',()=>{for(const k in input)input[k]=false});view('menu');requestAnimationFrame(loop);})();
</script></body></html>
